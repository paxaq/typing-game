<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff6d6;
    --bg2: #ffe0f0;
    --ink: #3b2a5a;
    --muted: #8a7aa8;
    --card: #ffffff;
    --key: #ffffff;
    --key-edge: #d9cdef;
    --accent: #ff5fa2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Fredoka", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 10%, var(--bg1), var(--bg2) 70%) fixed;
    background-color: var(--bg1);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  button { font-family: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ---------- Start screen ---------- */
  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 16px; overflow-y: auto;
  }
  #start h1 {
    margin: 0; font-size: clamp(40px, 9vw, 88px); font-weight: 700; letter-spacing: 1px;
    text-align: center; line-height: 1;
  }
  #start h1 span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  #start h1 span:nth-child(2n) { animation-delay: .3s; }
  #start h1 span:nth-child(3n) { animation-delay: .6s; }
  .modes { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .mode {
    width: 210px; max-width: 100%; padding: 18px 14px; border-radius: 26px; border: 4px solid transparent;
    background: var(--card); cursor: pointer; text-align: center;
    box-shadow: 0 6px 0 var(--key-edge); transition: transform .12s;
  }
  .mode:hover { transform: translateY(-3px); }
  .mode .ico { font-size: 52px; display: block; }
  .mode b { font-size: 24px; display: block; margin-top: 6px; }
  .mode small { font-size: 15px; color: var(--muted); }
  .mode.sel { border-color: var(--accent); box-shadow: 0 6px 0 #e0438a; }
  .opts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .seg { display: inline-flex; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: 0 3px 0 var(--key-edge); }
  .seg button {
    border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-size: 18px; cursor: pointer;
  }
  .seg button.sel { background: var(--accent); color: #fff; }
  #play {
    font-size: clamp(32px, 6vw, 48px); font-weight: 700; color: #fff; border: 0; cursor: pointer;
    padding: 16px 56px; border-radius: 999px; background: #3ccf6e; box-shadow: 0 8px 0 #24a14f;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #play:active { transform: translateY(6px); box-shadow: 0 2px 0 #24a14f; }
  .tip { color: var(--muted); font-size: 15px; text-align: center; max-width: 560px; margin: 0; }

  /* ---------- Game ---------- */
  #game { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; }
  #stars {
    height: 11vh; min-height: 48px; display: flex; align-items: center; gap: 1vw;
    font-size: min(6vh, 6vw);
  }
  #stars .s { filter: grayscale(1) opacity(.25); transition: filter .3s; }
  #stars .s.on { filter: none; animation: pop .5s; }
  #stage {
    flex: 1; min-height: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #prompt { font-size: min(5.5vh, 7vw); color: var(--muted); height: 1.2em; }
  #big {
    font-size: min(30vh, 45vw); line-height: 1; font-weight: 700;
    text-shadow: 0 .05em 0 rgba(0,0,0,.12);
  }
  #pic { font-size: min(11vh, 14vw); line-height: 1.1; min-height: 1.1em; text-align: center; max-width: 92vw; }
  #pic.many { font-size: min(7vh, 8vw); }
  #word { font-size: min(6vh, 8vw); font-weight: 700; min-height: 1.2em; }

  #kbd { padding: 1.5vh 16px 3vh; display: flex; flex-direction: column; align-items: center; gap: var(--gap); --k: min(8.2vw, 7.2vh, 76px); --gap: calc(var(--k) * .12); }
  .row { display: flex; gap: var(--gap); }
  .row:nth-child(3) { margin-left: calc(var(--k) * .35); }
  .row:nth-child(4) { margin-left: calc(var(--k) * .9); }
  .key {
    width: var(--k); height: var(--k); border-radius: calc(var(--k) * .22);
    background: var(--key); border: 0; box-shadow: 0 calc(var(--k) * .08) 0 var(--key-edge);
    font-size: calc(var(--k) * .5); font-weight: 700; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .08s, background .2s;
  }
  .key.space { width: calc(var(--k) * 5.5); font-size: calc(var(--k) * .3); color: var(--muted); }
  .key.hit { transform: translateY(calc(var(--k) * .06)); box-shadow: 0 calc(var(--k) * .02) 0 var(--key-edge); }
  .key.target { animation: glow 1s ease-in-out infinite; color: #fff; }
  .key.hint { animation: glow 1s ease-in-out infinite, jump .5s ease-in-out 3; }

  #exit {
    position: fixed; top: 10px; right: 12px; width: 52px; height: 52px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.7); font-size: 22px; cursor: pointer; overflow: hidden;
    color: var(--muted);
  }
  #exit .fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: var(--accent); opacity: .5; }
  #exit.holding .fill { height: 100%; transition: height 1.5s linear; }
  #exit .lbl { position: relative; }
  #exitTip {
    position: fixed; top: 70px; right: 12px; background: #fff; border-radius: 12px; padding: 6px 10px;
    font-size: 14px; color: var(--muted); box-shadow: 0 3px 10px rgba(0,0,0,.1);
  }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  .pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .wiggle { animation: wiggle .45s; }
  @keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 var(--c, #ff5fa2), 0 calc(var(--k) * .08) 0 var(--key-edge); }
                    50% { box-shadow: 0 0 0 calc(var(--k) * .15) var(--c, #ff5fa2), 0 calc(var(--k) * .08) 0 var(--key-edge); } }
  @keyframes jump { 0%,100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--k) * -.4)); } }
</style>
</head>
<body>

<section id="start">
  <h1><span>L</span><span>e</span><span>t</span><span>t</span><span>e</span><span>r</span> <span>P</span><span>a</span><span>r</span><span>t</span><span>y</span> <span>🎉</span></h1>

  <div class="modes" id="modes">
    <button class="mode" data-mode="explore"><span class="ico">🎨</span><b>Explore</b><small>Press any key — see &amp; hear it!</small></button>
    <button class="mode" data-mode="letters"><span class="ico">🔍</span><b>Find Letters</b><small>Find the glowing letter</small></button>
    <button class="mode" data-mode="numbers"><span class="ico">🔢</span><b>Find Numbers</b><small>Count and find 1 to 9</small></button>
  </div>

  <div class="opts">
    <div class="seg" data-opt="case">
      <button data-v="upper">ABC</button><button data-v="lower">abc</button><button data-v="both">Aa</button>
    </div>
    <div class="seg" data-opt="voice">
      <button data-v="on">🗣️ Voice</button><button data-v="off">Quiet</button>
    </div>
    <div class="seg" data-opt="sound">
      <button data-v="on">🎵 Music</button><button data-v="off">Off</button>
    </div>
  </div>

  <button id="play">▶ Play</button>
  <p class="tip">Grown-ups: the game goes full screen and catches stray key presses.
    To leave, hold the ⏏ button in the corner (or hold Esc) for 2 seconds.</p>
</section>

<section id="game" class="hidden">
  <div id="stars"></div>
  <div id="stage">
    <div id="prompt"></div>
    <div id="big"></div>
    <div id="pic"></div>
    <div id="word"></div>
  </div>
  <div id="kbd"></div>
  <button id="exit" title="Hold to exit"><span class="fill"></span><span class="lbl">⏏</span></button>
  <div id="exitTip" class="hidden">Keep holding…</div>
</section>

<canvas id="fx"></canvas>

<script>
(() => {
  "use strict";

  // ---------- Content ----------
  const LETTERS = {
    A: ["Apple", "🍎"], B: ["Bear", "🐻"], C: ["Cat", "🐱"], D: ["Dog", "🐶"],
    E: ["Elephant", "🐘"], F: ["Fish", "🐟"], G: ["Giraffe", "🦒"], H: ["House", "🏠"],
    I: ["Ice cream", "🍦"], J: ["Juice", "🧃"], K: ["Koala", "🐨"], L: ["Lion", "🦁"],
    M: ["Monkey", "🐵"], N: ["Nose", "👃"], O: ["Octopus", "🐙"], P: ["Penguin", "🐧"],
    Q: ["Queen", "👸"], R: ["Rabbit", "🐰"], S: ["Sun", "☀️"], T: ["Tiger", "🐯"],
    U: ["Umbrella", "☂️"], V: ["Volcano", "🌋"], W: ["Whale", "🐳"], X: ["Xylophone", "🎶"],
    Y: ["Yo-yo", "🪀"], Z: ["Zebra", "🦓"],
  };
  // Letter names as the speech engine should say them (bare "A" is often read as "uh").
  const SPOKEN = { A: "ay" };
  const NUMBER_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
  const NUMBER_ITEMS = ["⭕", "🍓", "🐥", "🎈", "🍪", "🐠", "🌸", "🚗", "🍌", "⭐"];
  const FUN = ["🎈", "⭐", "🌈", "🦄", "🎉", "🫧", "🌟", "🍭", "🦋", "🎊"];
  const PRAISE = ["Yay!", "Great job!", "You found it!", "Super!", "Wow!", "Hooray!", "Awesome!"];
  const COLORS = ["#ff4f81", "#ff9f1c", "#f7c600", "#3ccf6e", "#1fb5e8", "#7b61ff", "#e95cff", "#ff6b4a", "#00c2a8", "#5b8cff"];
  const SCALE = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
  const ROWS = ["1234567890", "QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  const STAR_GOAL = 10;

  const isLetter = k => /^[A-Z]$/.test(k);
  const isDigit = k => /^[0-9]$/.test(k);
  const colorOf = k => COLORS[(k.charCodeAt(0) * 7) % COLORS.length];
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const $ = id => document.getElementById(id);

  // ---------- Options (remembered per browser) ----------
  const defaults = { mode: "explore", case: "upper", voice: "on", sound: "on" };
  let opts = { ...defaults };
  try { Object.assign(opts, JSON.parse(localStorage.getItem("letterParty") || "{}")); } catch (_) {}
  const saveOpts = () => { try { localStorage.setItem("letterParty", JSON.stringify(opts)); } catch (_) {} };

  function syncMenu() {
    document.querySelectorAll(".mode").forEach(b => b.classList.toggle("sel", b.dataset.mode === opts.mode));
    document.querySelectorAll(".seg").forEach(seg => {
      seg.querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.v === opts[seg.dataset.opt]));
    });
  }
  document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => { opts.mode = b.dataset.mode; saveOpts(); syncMenu(); }));
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    opts[b.parentElement.dataset.opt] = b.dataset.v; saveOpts(); syncMenu();
  }));
  syncMenu();

  const label = k => {
    if (!isLetter(k)) return k;
    if (opts.case === "lower") return k.toLowerCase();
    if (opts.case === "both") return k + k.toLowerCase();
    return k;
  };
  const spokenName = k => isLetter(k) ? (SPOKEN[k] || k) : NUMBER_WORDS[+k];

  // ---------- Sound ----------
  let audio = null;
  function initAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
    if (audio && audio.state === "suspended") audio.resume();
  }
  function tone(freq, { dur = 0.35, type = "sine", vol = 0.18, when = 0, glide = 0 } = {}) {
    if (!audio || opts.sound !== "on") return;
    const t = audio.currentTime + when;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(freq * glide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const noteFor = k => SCALE[(k.charCodeAt(0) * 3) % SCALE.length];
  const sfx = {
    key: k => { tone(noteFor(k), { type: "triangle", vol: 0.2 }); tone(noteFor(k) * 2, { vol: 0.05 }); },
    chime: () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, { when: i * 0.09, type: "triangle", vol: 0.16 })),
    fanfare: () => [392, 523.25, 659.25, 783.99, 659.25, 783.99, 1046.5].forEach((f, i) =>
      tone(f, { when: i * 0.13, dur: i === 6 ? 0.8 : 0.25, type: "triangle", vol: 0.18 })),
    boop: () => tone(330, { dur: 0.25, vol: 0.12, glide: 0.7 }),
    whoosh: () => tone(300 + Math.random() * 200, { dur: 0.4, vol: 0.12, glide: 3 }),
  };

  // ---------- Voice ----------
  let voice = null;
  function chooseVoice() {
    if (!window.speechSynthesis) return;
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    voice = vs.find(v => /Google US English|Samantha|Aria|Jenny|Zira/i.test(v.name))
         || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
  }
  if (window.speechSynthesis) { chooseVoice(); speechSynthesis.onvoiceschanged = chooseVoice; }
  function say(text) {
    if (opts.voice !== "on" || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.rate = 0.85; u.pitch = 1.25;
    speechSynthesis.speak(u);
  }

  // ---------- Particles ----------
  const cv = $("fx"), cx = cv.getContext("2d");
  let parts = [], running = false, W = 0, H = 0;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();

  function burst(x, y, { n = 40, emoji = null, speed = 9, colors = COLORS } = {}) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random());
      const useEmoji = emoji && Math.random() < 0.35;
      parts.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4,
        life: 1, decay: 0.007 + Math.random() * 0.01,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
        size: useEmoji ? 26 + Math.random() * 26 : 7 + Math.random() * 9,
        color: pick(colors), shape: useEmoji ? "emoji" : pick(["rect", "circle", "star"]), emoji,
      });
    }
    if (parts.length > 900) parts.splice(0, parts.length - 900);
    if (!running) { running = true; requestAnimationFrame(frame); }
  }
  function rain(emoji, n = 60) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * W, y: -40 - Math.random() * H * 0.8, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
        life: 1, decay: 0.003, rot: 0, vr: (Math.random() - 0.5) * 0.1,
        size: Math.random() < 0.5 ? 34 + Math.random() * 20 : 10, color: pick(COLORS),
        shape: Math.random() < 0.5 ? "emoji" : "rect", emoji: emoji || pick(FUN),
      });
    }
    if (!running) { running = true; requestAnimationFrame(frame); }
  }
  function star(r) {
    cx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.45 : r, a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    cx.closePath(); cx.fill();
  }
  function frame() {
    cx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.vy += 0.22; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      cx.save();
      cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
      cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.color;
      if (p.shape === "emoji") { cx.font = `${p.size}px serif`; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(p.emoji, 0, 0); }
      else if (p.shape === "rect") cx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else if (p.shape === "circle") { cx.beginPath(); cx.arc(0, 0, p.size / 2, 0, Math.PI * 2); cx.fill(); }
      else star(p.size * 0.7);
      cx.restore();
    }
    parts = parts.filter(p => p.life > 0 && p.y < H + 80);
    if (parts.length) requestAnimationFrame(frame); else { running = false; cx.clearRect(0, 0, W, H); }
  }

  // ---------- On-screen keyboard ----------
  const kbd = $("kbd"), keyEls = {};
  ROWS.forEach(r => {
    const row = document.createElement("div"); row.className = "row";
    for (const k of r) {
      const b = document.createElement("button");
      b.className = "key"; b.dataset.k = k; b.textContent = k;
      row.appendChild(b); keyEls[k] = b;
    }
    kbd.appendChild(row);
  });
  {
    const row = document.createElement("div"); row.className = "row";
    const b = document.createElement("button"); b.className = "key space"; b.dataset.k = "SPACE"; b.textContent = "space";
    row.appendChild(b); keyEls.SPACE = b; kbd.appendChild(row);
  }
  kbd.addEventListener("pointerdown", e => {
    const b = e.target.closest(".key"); if (!b) return;
    e.preventDefault(); handle(b.dataset.k);
  });
  function flashKey(k) {
    const el = keyEls[k]; if (!el) return;
    el.classList.add("hit");
    el.style.background = k === "SPACE" ? "#ffe9a8" : colorOf(k) + "55";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.classList.remove("hit"); if (!el.classList.contains("target")) el.style.background = ""; }, 220);
  }
  function setTarget(k) {
    Object.values(keyEls).forEach(el => { el.classList.remove("target", "hint"); el.style.background = ""; el.style.removeProperty("--c"); });
    if (k && keyEls[k]) {
      const el = keyEls[k];
      el.classList.add("target");
      el.style.background = colorOf(k);
      el.style.setProperty("--c", colorOf(k) + "66");
    }
  }

  // ---------- Stage ----------
  const big = $("big"), pic = $("pic"), word = $("word"), prompt = $("prompt"), starsEl = $("stars");
  function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function picFor(k) { return isLetter(k) ? LETTERS[k][1] : (+k === 0 ? NUMBER_ITEMS[0] : NUMBER_ITEMS[+k].repeat(+k)); }
  function wordFor(k) { return isLetter(k) ? LETTERS[k][0] : NUMBER_WORDS[+k][0].toUpperCase() + NUMBER_WORDS[+k].slice(1); }
  function show(k, { showWord = true } = {}) {
    big.textContent = label(k);
    big.style.color = colorOf(k);
    pic.textContent = picFor(k);
    pic.classList.toggle("many", isDigit(k) && +k > 4);
    word.textContent = showWord ? wordFor(k) : "";
    word.style.color = colorOf(k);
    restartAnim(big, "pop");
    restartAnim(pic, "pop");
  }
  function bigCenter() { const r = big.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

  let stars = 0;
  function drawStars() {
    starsEl.innerHTML = "";
    for (let i = 0; i < STAR_GOAL; i++) {
      const s = document.createElement("span"); s.className = "s" + (i < stars ? " on" : ""); s.textContent = "⭐";
      starsEl.appendChild(s);
    }
  }

  // ---------- Game logic ----------
  let playing = false, target = null, busy = false, hintTimer = null, lastWrongSay = 0, lastTarget = null;

  function poolFor(mode) {
    return mode === "numbers" ? "123456789".split("") : Object.keys(LETTERS);
  }
  function findPhrase(k) { return isLetter(k) ? `Find the letter ${spokenName(k)}!` : `Find the number ${spokenName(k)}!`; }

  function nextTarget() {
    const pool = poolFor(opts.mode).filter(k => k !== lastTarget);
    target = lastTarget = pick(pool);
    prompt.textContent = "Find 🔍";
    show(target, { showWord: false });
    setTarget(target);
    say(findPhrase(target));
    scheduleHint();
  }
  function scheduleHint() {
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function hint() {
      if (!playing || busy || !target) return;
      const el = keyEls[target];
      if (el) restartAnim(el, "hint");
      say(`${findPhrase(target)} Look for the glowing key.`);
      hintTimer = setTimeout(hint, 12000);
    }, 7000);
  }

  function success() {
    busy = true;
    clearTimeout(hintTimer);
    const k = target;
    setTarget(null);
    show(k);
    prompt.textContent = pick(PRAISE);
    const [x, y] = bigCenter();
    burst(x, y, { n: 70, emoji: isLetter(k) ? LETTERS[k][1] : NUMBER_ITEMS[+k], speed: 12 });
    sfx.chime();
    stars++;
    drawStars();
    const phrase = isLetter(k) ? `${pick(PRAISE)} ${spokenName(k)}, for ${LETTERS[k][0]}!` : `${pick(PRAISE)} ${NUMBER_WORDS[+k]}!`;
    if (stars >= STAR_GOAL) {
      setTimeout(() => {
        sfx.fanfare(); rain(null, 90);
        burst(W * 0.25, H * 0.5, { n: 80, speed: 14 }); burst(W * 0.75, H * 0.5, { n: 80, speed: 14 });
        say("Hooray! You got all the stars! You are amazing!");
        prompt.textContent = "🏆 All the stars! 🏆";
      }, 900);
      setTimeout(() => { stars = 0; drawStars(); busy = false; nextTarget(); }, 5500);
      say(phrase);
    } else {
      say(phrase);
      setTimeout(() => { busy = false; if (playing) nextTarget(); }, 2300);
    }
  }

  function wrong(k) {
    flashKey(k);
    sfx.boop();
    restartAnim(big, "wiggle");
    const now = performance.now();
    if (now - lastWrongSay > 3000) {
      lastWrongSay = now;
      say(`That's ${spokenName(k)}. ${findPhrase(target)}`);
    }
    scheduleHint();
  }

  function explore(k) {
    if (isLetter(k) || isDigit(k)) {
      flashKey(k);
      prompt.textContent = "";
      show(k);
      sfx.key(k);
      const [x, y] = bigCenter();
      burst(x, y, { n: 28, emoji: isLetter(k) ? LETTERS[k][1] : NUMBER_ITEMS[+k], speed: 8 });
      say(isLetter(k) ? `${spokenName(k)}. ${LETTERS[k][0]}!` : `${NUMBER_WORDS[+k]}!`);
    } else {
      if (k === "SPACE") flashKey(k);
      sfx.whoosh();
      burst(W * (0.15 + Math.random() * 0.7), H * (0.2 + Math.random() * 0.4), { n: 35, emoji: pick(FUN), speed: 10 });
    }
  }

  function handle(k) {
    if (!playing) return;
    initAudio();
    if (opts.mode === "explore") return explore(k);
    if (busy) return;
    if (k === target) return success();
    if (isLetter(k) || isDigit(k)) return wrong(k);
    // other keys: a tiny sparkle so it's never "dead"
    burst(W * Math.random(), H * 0.3, { n: 12, speed: 6 });
  }

  function normKey(e) {
    if (e.key && e.key.length === 1 && /[a-z0-9]/i.test(e.key)) return e.key.toUpperCase();
    let m = /^Key([A-Z])$/.exec(e.code || ""); if (m) return m[1];
    m = /^(?:Digit|Numpad)([0-9])$/.exec(e.code || ""); if (m) return m[1];
    if (e.code === "Space" || e.key === " ") return "SPACE";
    return "OTHER";
  }

  // ---------- Start / exit ----------
  let wentFullscreen = false;
  async function startGame() {
    initAudio();
    $("start").classList.add("hidden");
    $("game").classList.remove("hidden");
    playing = true; busy = false; stars = 0; target = null; lastTarget = null;
    starsEl.style.visibility = opts.mode === "explore" ? "hidden" : "visible";
    drawStars();
    setTarget(null);
    try {
      if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
        wentFullscreen = true;
      }
      // Chrome/Edge: capture Esc, Ctrl+W, etc. while fullscreen so little hands can't escape.
      if (navigator.keyboard && navigator.keyboard.lock) await navigator.keyboard.lock();
    } catch (_) {}
    if (opts.mode === "explore") {
      big.textContent = "👋"; big.style.color = ""; restartAnim(big, "pop");
      pic.textContent = ""; word.textContent = "";
      prompt.textContent = "Press any key!";
      say("Press any key!");
    } else {
      setTimeout(nextTarget, 400);
    }
  }
  function exitGame() {
    playing = false; busy = false;
    clearTimeout(hintTimer);
    if (window.speechSynthesis) speechSynthesis.cancel();
    try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch (_) {}
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    wentFullscreen = false;
    $("game").classList.add("hidden");
    $("start").classList.remove("hidden");
    exitBtn.classList.remove("holding"); $("exitTip").classList.add("hidden");
  }
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && wentFullscreen && playing) exitGame();
  });

  $("play").addEventListener("click", startGame);

  // Hold-to-exit button (2 seconds) so random taps don't quit.
  const exitBtn = $("exit");
  let exitHold = null;
  const cancelHold = () => { clearTimeout(exitHold); exitBtn.classList.remove("holding"); $("exitTip").classList.add("hidden"); };
  exitBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    exitBtn.classList.add("holding"); $("exitTip").classList.remove("hidden");
    exitHold = setTimeout(exitGame, 1500);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => exitBtn.addEventListener(ev, cancelHold));

  // Keyboard
  let escHold = null;
  addEventListener("keydown", e => {
    if (!playing) {
      if (e.key === "Enter" && !$("start").classList.contains("hidden") && document.activeElement === document.body) startGame();
      return;
    }
    e.preventDefault();
    if (e.key === "Escape") {
      if (!escHold) escHold = setTimeout(exitGame, 2000);
      return;
    }
    if (e.repeat) return;
    handle(normKey(e));
  }, { capture: true });
  addEventListener("keyup", e => {
    if (e.key === "Escape") { clearTimeout(escHold); escHold = null; }
  });

  // Clicks/taps on the stage also make sparkles in Explore mode.
  $("stage").addEventListener("pointerdown", e => {
    if (!playing || opts.mode !== "explore") return;
    initAudio(); sfx.whoosh();
    burst(e.clientX, e.clientY, { n: 30, emoji: pick(FUN) });
  });

  // Stop the context menu & accidental navigation during play.
  addEventListener("contextmenu", e => { if (playing) e.preventDefault(); });
  addEventListener("beforeunload", e => { if (playing) { e.preventDefault(); e.returnValue = ""; } });
})();
</script>
</body>
